[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "auth-2.1"
version = "0.1.0"
description = "Online constructor for OAuth 2.1 / OpenID Connect integration files"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Kilo Agent" }]
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.27.0",
    "oauthlib>=4.0.0",
    "pydantic>=2.5.0",
    "jinja2>=3.1.2",
    "pyyaml>=6.0.1",
    "python-multipart>=0.0.6",
]

[project.scripts]
auth-2.1 = "backend.app.main:main"

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "N", "UP", "B", "C4", "PL", "RUF"]

[tool.ruff.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.11"
strict = true
disallow_untyped_defs = true
disallow_any_generics = true
